---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-configurer
spec:
  interval: 5m
  url: ssh://git@github.com/kadras-io/my-gitops-repo
  ref:
    branch: production
  secretRef:
    name: git-credentials
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-configurer
spec:
  interval: 5m
  path: clusters/production
  targetNamespace: apps
  serviceAccountName: gitops-deployer
  prune: false
  wait: false
  timeout: 3m
