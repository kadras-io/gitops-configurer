---
# By default, the OCIRepository pulls the `latest` tag with static credentials.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gitops-configurer
  namespace: kadras-system
  labels:
    app.kubernetes.io/component: gitops-configurer
spec:
  interval: 1m0s
  url: oci://ghcr.io/kadras-io/my-gitops-artifact
  provider: generic
  ref:
    tag: latest
  secretRef:
    name: registry-credentials
  (serviceAccountName == null): true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-configurer
spec:
  sourceRef:
    kind: OCIRepository
    name: gitops-configurer
  path: ./clusters/staging
