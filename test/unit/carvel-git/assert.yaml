---
# The App fetches the Git repository, renders the manifests with ytt and kbld, and deploys them with kapp.
apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: gitops-configurer
  namespace: kadras-system
  labels:
    app.kubernetes.io/component: gitops-configurer
spec:
  serviceAccountName: gitops-deployer
  syncPeriod: 10m
  fetch:
  - git:
      url: https://github.com/kadras-io/my-gitops-repo
      ref: production
      subPath: clusters/production
      secretRef:
        name: git-credentials
  template:
  - ytt:
      ignoreUnknownComments: true
      (paths == null): true
  - kbld: {}
  deploy:
  - kapp:
      intoNs: apps
  (length(fetch)): 1
