---
# kapp-controller selects the tag matching the semver range, so the image has no tag.
apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: gitops-configurer
spec:
  fetch:
  - imgpkgBundle:
      image: ghcr.io/kadras-io/my-gitops-bundle
      tagSelection:
        semver:
          constraints: 1.x
