---
# The GitRepository fetches the manifests, and the Kustomization applies them: the install step waits for it to be ready.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-configurer
  namespace: tests
status:
  conditions:
  - reason: Succeeded
    status: "True"
    type: Ready
  - reason: Succeeded
    status: "True"
    type: ArtifactInStorage
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-configurer
  namespace: tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: tests
