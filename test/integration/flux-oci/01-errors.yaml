---
# Uninstalling the package deletes the GitOps resources and, since `flux.prune` is enabled, the workloads they applied.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gitops-configurer
  namespace: tests
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-configurer
  namespace: tests
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: tests
