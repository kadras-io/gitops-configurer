---
# The OCIRepository fetches the manifests, and the Kustomization applies them and waits for them to be ready.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gitops-configurer
  namespace: tests
status:
  conditions:
  - reason: Succeeded
    status: "True"
    type: Ready
  - reason: Succeeded
    status: "True"
    type: ArtifactInStorage
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-configurer
  namespace: tests
status:
  conditions:
  - reason: ReconciliationSucceeded
    status: "True"
    type: Ready
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: tests
