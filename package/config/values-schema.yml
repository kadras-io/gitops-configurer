#@ load("/lib/validation.star", "is_digest", "is_dns_label", "is_dns_subdomain", "is_duration")

#@ def git_url_set(values):
#@   return values["source"] != "git" or values["git"]["url"] != ""
#@ end

#@ def oci_url_set(values):
#@   return values["source"] != "oci" or values["oci"]["url"] != ""
#@ end

#@ def oci_ref_unambiguous(values):
#@   return values["oci"]["semver"] == "" or values["oci"]["digest"] == ""
#@ end

#@data/values-schema
#@schema/validation ("`git.url` to be set when `source` is `git`", git_url_set), ("`oci.url` to be set when `source` is `oci`", oci_url_set), ("at most one of `oci.semver` and `oci.digest` to be set", oci_ref_unambiguous)
---

#@schema/desc "The namespace in which to create the GitOps resources. It must exist."
#@schema/validation ("a valid DNS label", is_dns_label), min_len=1, max_len=63
namespace: kadras-system

#@schema/desc "The name of the GitOps resources."
#@schema/validation ("a valid DNS subdomain", is_dns_subdomain), min_len=1, max_len=253
name: gitops-configurer

#! =============================================
#! Reconciliation
#! =============================================

#@schema/desc "The ServiceAccount in the same namespace whose permissions are used to deploy the manifests. When empty, the kustomize controller uses its own permissions."
service_account: ""

#@schema/desc "The namespace in which to deploy the manifests, overriding the namespace they set, if any. When empty, all the manifests of namespaced resources must set one."
#@schema/validation ("a valid DNS label", lambda v: v == "" or is_dns_label(v))
target_namespace: ""

#@schema/desc "The interval at which the source is fetched and the manifests reconciled with the cluster, as a Go duration."
#@schema/validation ("a Go duration, like `1m0s`", is_duration)
interval: 1m0s

#@schema/desc "Whether to delete the resources removed from the source. It also deletes all the resources applied by the Kustomization when it's deleted, including when uninstalling the package."
prune: true
#@schema/desc "Whether to wait for the applied resources to become ready before marking the Kustomization as ready."
wait: true
#@schema/desc "The timeout for applying the manifests and, with `wait`, for the resources to become ready, as a Go duration."
#@schema/validation ("a Go duration, like `1m0s`", is_duration)
timeout: 1m0s

#! =============================================
#! Source
#! =============================================

#@schema/desc "Where the manifests are fetched from: `git` for a Git repository, `oci` for a Flux OCI artifact."
#@schema/validation one_of=["git", "oci"]
source: git

#@schema/desc "Settings for the `git` source."
git:
  #@schema/desc "The URL of the Git repository. Required with the `git` source."
  #@schema/examples ("HTTPS", "https://github.com/kadras-io/my-gitops-repo"), ("SSH", "ssh://git@github.com/kadras-io/my-gitops-repo")
  url: ""
  #@schema/desc "The Git branch to check out."
  #@schema/validation min_len=1
  branch: main
  #@schema/desc "The path within the Git repository containing the manifests. The root of the repository when empty."
  path: ""
  #@schema/desc "The name of the Secret in the same namespace holding the credentials to access the Git repository. See docs/sources.md for the expected format."
  secret_name: ""

#@schema/desc "Settings for the `oci` source."
oci:
  #@schema/desc "The URL of the OCI artifact, with the `oci://` scheme. Required with the `oci` source."
  #@schema/examples ("Flux artifact", "oci://ghcr.io/stefanprodan/manifests/podinfo")
  #@schema/validation ("a URL with the `oci://` scheme", lambda v: v == "" or v.startswith("oci://"))
  url: ""
  #@schema/desc "The tag of the OCI artifact. Ignored when `oci.semver` or `oci.digest` is set."
  #@schema/validation min_len=1
  tag: latest
  #@schema/desc "The semver range selecting the tag of the OCI artifact, like `1.x` or `>=1.0.0`. The highest matching tag is used."
  semver: ""
  #@schema/desc "The digest of the OCI artifact, like `sha256:5f2f...`. It takes precedence over `oci.tag`."
  #@schema/validation ("a digest in the `sha256:<hex>` format", lambda v: v == "" or is_digest(v))
  digest: ""
  #@schema/desc "The path within the OCI artifact containing the manifests. The root of the artifact when empty."
  path: ""
  #@schema/desc "The name of the Secret in the same namespace holding the credentials to access the OCI registry. See docs/sources.md for the expected format."
  secret_name: ""
  #@schema/desc "The provider used to authenticate with the OCI registry: `generic` for the credentials in `oci.secret_name`, or a cloud provider for workload identity."
  #@schema/validation one_of=["generic", "aws", "azure", "gcp"]
  provider: generic
  #@schema/desc "The ServiceAccount in the same namespace used to authenticate with the OCI registry: its image pull secrets with the `generic` provider, its workload identity with a cloud provider."
  service_account: ""
