#@ load("@ytt:data", "data")
#@ load("/lib/gitops.star", "is_git", "is_oci", "labels", "oci_image", "oci_ref", "source_path")

#! The kapp-controller App fetches the manifests from the source, renders them with ytt, resolves the images with kbld,
#! and deploys them with kapp, using the permissions of the ServiceAccount. An OCI source is fetched as an imgpkg bundle.
#! See: https://carvel.dev/kapp-controller/docs/latest/app-spec/

#@ if/end data.values.controller == "carvel":
---
apiVersion: kappctrl.k14s.io/v1alpha1
kind: App
metadata:
  name: #@ data.values.name
  namespace: #@ data.values.namespace
  labels: #@ labels()
spec:
  serviceAccountName: #@ data.values.service_account
  syncPeriod: #@ data.values.interval
  fetch:
    #@ if is_git():
    - git:
        url: #@ data.values.git.url
        ref: #@ data.values.git.branch
        #@ if/end data.values.git.secret_name != "":
        secretRef:
          name: #@ data.values.git.secret_name
        #@ if/end source_path() != "":
        subPath: #@ source_path()
    #@ end
    #@ if is_oci():
    - imgpkgBundle:
        image: #@ oci_image()
        #@ if/end "semver" in oci_ref():
        tagSelection:
          semver:
            constraints: #@ oci_ref()["semver"]
        #@ if/end data.values.oci.secret_name != "":
        secretRef:
          name: #@ data.values.oci.secret_name
    #@ end
  template:
    - ytt:
        ignoreUnknownComments: true
        #@ if/end is_oci() and source_path() != "":
        paths:
          - #@ source_path()
    - kbld: {}
  deploy:
    - kapp: {}
