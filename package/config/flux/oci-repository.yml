#@ load("@ytt:data", "data")
#@ load("/lib/gitops.star", "is_oci", "labels", "oci_ref")

#! The Flux OCIRepository fetches the manifests from the OCI artifact, for the Kustomization.
#! See: https://fluxcd.io/flux/components/source/ocirepositories/

#@ if/end is_oci():
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: #@ data.values.name
  namespace: #@ data.values.namespace
  labels: #@ labels()
spec:
  interval: #@ data.values.interval
  url: #@ data.values.oci.url
  provider: #@ data.values.oci.provider
  ref: #@ oci_ref()
  #@ if/end data.values.oci.secret_name != "":
  secretRef:
    name: #@ data.values.oci.secret_name
  #@ if/end data.values.oci.service_account != "":
  serviceAccountName: #@ data.values.oci.service_account
