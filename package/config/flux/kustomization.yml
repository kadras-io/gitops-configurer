#@ load("@ytt:data", "data")
#@ load("/lib/gitops.star", "flux_source_kind", "labels", "source_path")

#! The Flux Kustomization applies the manifests fetched by the source, using the permissions of the ServiceAccount
#! when set, or the ones of the kustomize controller otherwise.
#! See: https://fluxcd.io/flux/components/kustomize/kustomizations/

#@ if/end data.values.controller == "flux":
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: #@ data.values.name
  namespace: #@ data.values.namespace
  labels: #@ labels()
spec:
  interval: #@ data.values.interval
  sourceRef:
    kind: #@ flux_source_kind()
    name: #@ data.values.name
  #@ if/end source_path() != "":
  path: #@ source_path()
  #@ if/end data.values.service_account != "":
  serviceAccountName: #@ data.values.service_account
  prune: #@ data.values.flux.prune
  wait: #@ data.values.flux.wait
  timeout: #@ data.values.flux.timeout
