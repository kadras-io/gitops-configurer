#@ load("@ytt:data", "data")

#@ def source_kind():
#@   return "GitRepository" if data.values.type == "flux-kustomization" else "OCIRepository"
#@ end

#@ def source_path():
#@   return data.values.git.path if data.values.type == "flux-kustomization" else data.values.oci.path
#@ end

#@ if/end data.values.type in ["flux-kustomization", "flux-oci-kustomization"]:
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: #@ data.values.name
  namespace: #@ data.values.namespace
  labels:
    app.kubernetes.io/component: gitops-configurer
spec:
  #@ if/end data.values.service_account != "":
  serviceAccountName: #@ data.values.service_account
  interval: #@ data.values.sync_period
  sourceRef:
    kind: #@ source_kind()
    name: #@ data.values.name
  #@ if/end source_path() != "":
  path: #@ source_path()
  prune: true
  wait: true
  timeout: 1m0s
