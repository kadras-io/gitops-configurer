#@ load("@ytt:data", "data")
#@ load("/lib/gitops.star", "is_git", "labels")

#! The Flux GitRepository fetches the manifests from the Git repository, for the Kustomization.
#! See: https://fluxcd.io/flux/components/source/gitrepositories/

#@ if/end is_git():
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: #@ data.values.name
  namespace: #@ data.values.namespace
  labels: #@ labels()
spec:
  interval: #@ data.values.interval
  url: #@ data.values.git.url
  ref:
    branch: #@ data.values.git.branch
  #@ if/end data.values.git.secret_name != "":
  secretRef:
    name: #@ data.values.git.secret_name
